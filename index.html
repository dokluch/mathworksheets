<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- seo:head -->
    <!-- Title, description, canonical, Open Graph, Twitter and JSON-LD are
         generated from src/worksheets.js by the seoHtml() plugin in vite.config.js
         (and per route by scripts/prerender.mjs after the build). -->
    <!-- /seo:head -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- seo:content -->
    <!-- Static, crawlable page content is injected here at build time and
         removed by src/main.jsx before React mounts. -->
    <!-- /seo:content -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
